site_name: PyCSP
site_description: Computational Singular Perturbation tools for the analysis and simplification of chemically reacting systems
site_author: Riccardo Malpica Galassi
site_url: https://rmalpica.github.io/PyCSP/
repo_url: https://github.com/rmalpica/PyCSP
repo_name: rmalpica/PyCSP
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2025 Riccardo Malpica Galassi &mdash; Prosperity Public License 3.0.0

theme:
  name: material
  logo: assets/img/logo.png
  favicon: assets/img/logo.png
  font:
    text: Source Serif 4
    code: Source Code Pro
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.highlight

extra_css:
  - assets/css/pycsp.css

extra_javascript:
  - assets/js/mathjax-config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      linenums: true
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: false
            show_root_heading: true
            show_signature_annotations: false
            docstring_style: numpy
            members_order: source
            filters: ["!^_"]

nav:
  - Introduction: index.md
  - Installation: installation.md
  - Theory:
      - CSP and TSR analysis: theory/analysis.md
      - Mechanism simplification: theory/simplification.md
      - CSP solver and G-Scheme: theory/solvers.md
  - Classes, attributes and methods:
      - api/index.md
      - ThermoKinetics.py: api/thermokinetics.md
      - Functions.py: api/functions.md
      - Solver.py: api/solver.md
      - GScheme.py: api/gscheme.md
      - Simplify.py: api/simplify.md
      - utils.py: api/utils.md
  - Examples:
      - examples/index.md
      - CSP analysis: examples/csp-analysis.md
      - Full CSP analysis and plots: examples/full-analysis.md
      - CSP solver and G-Scheme: examples/csp-solver.md
      - CSP simplify: examples/csp-simplify.md
      - TSR analysis: examples/tsr.md
  - API reference (docstrings): reference.md
  - References: references.md
